name: Compilar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restaurar
        run: dotnet restore src/MaxSnapr/MaxSnapr.csproj
      - name: Paquetes con vulnerabilidades conocidas
        shell: pwsh
        run: |
          $out = dotnet list src/MaxSnapr/MaxSnapr.csproj package --vulnerable --include-transitive
          $out
          if ($out -match '>\s') { throw 'Hay paquetes con vulnerabilidades conocidas' }
      - name: Compilar (Release)
        run: dotnet build src/MaxSnapr/MaxSnapr.csproj -c Release --no-restore
